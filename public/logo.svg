<svg width="560" height="180" viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Palpitaí">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;display=swap');
      .wordmark { font-family: 'Sora', 'Trebuchet MS', sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- speed arc -->
  <path d="M14 122 A 60 60 0 0 1 22 58" fill="none" stroke="#C6FF00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- ball -->
  <circle cx="70" cy="90" r="44" fill="#C6FF00"/>
  <!-- central pentagon -->
  <path d="M70 74 L85.2 85.1 L79.4 102.9 L60.6 102.9 L54.8 85.1 Z" fill="#14181C"/>
  <!-- seams -->
  <g stroke="#14181C" stroke-width="2.6" stroke-linecap="round" opacity="0.92">
    <line x1="70" y1="74" x2="70" y2="48"/>
    <line x1="85.2" y1="85.1" x2="109.9" y2="77.0"/>
    <line x1="79.4" y1="102.9" x2="94.7" y2="124.0"/>
    <line x1="60.6" y1="102.9" x2="45.3" y2="124.0"/>
    <line x1="54.8" y1="85.1" x2="30.1" y2="77.0"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="120" class="wordmark" font-size="92" letter-spacing="-3" fill="#14181C">palpitaí</text>
</svg>
